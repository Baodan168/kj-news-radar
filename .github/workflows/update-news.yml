name: Update Cross-Border News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: update-crossborder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install BrowserAct CLI (optional)
        continue-on-error: true
        run: |
          pip install --retries 3 browser-act-cli 2>/dev/null || echo "WARN: browser-act-cli install skipped"
          browser-act --version 2>/dev/null || echo "INFO: BrowserAct CLI not available; script will skip browser-dependent sources"

      - name: Install Google Chrome (optional)
        continue-on-error: true
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable
          google-chrome-stable --version

      - name: Setup BrowserAct
        continue-on-error: true
        run: |
          browser-act get-skills core --skill-version 2.0.2 || true
          browser-act browser create --type chrome --name "ci-browser" --desc "CI browser for news scraping" || true

      - name: Prepare OPML
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -n "$FOLLOW_OPML_B64" ]; then
            echo "$FOLLOW_OPML_B64" | base64 --decode > feeds/follow.opml
            echo "Loaded feeds/follow.opml from secret"
          elif [ -f feeds/follow.example.opml ]; then
            cp feeds/follow.example.opml feeds/follow.opml
            echo "Loaded example OPML"
          else
            echo "No OPML file; RSS is optional"
          fi

      - name: Update data
        run: |
          python scripts/update_crossborder.py --output-dir data --window-hours 24

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update news snapshot $(date -u '+%Y-%m-%d %H:%M')"
            git push
          fi
